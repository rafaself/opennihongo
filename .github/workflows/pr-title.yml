name: Validate PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate:
    name: Conventional PR title
    runs-on: ubuntu-latest

    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            ci
            build
            perf
            revert
          requireScope: false
          subjectPattern: '^(?![A-Z]).*[^.]$'
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start with a lowercase
            character and must not end with a period.
