[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opennihongo-audio-generator"
version = "0.1.0"
description = "Development-only VOICEVOX pronunciation asset generator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opennihongo-audio = "audio_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
